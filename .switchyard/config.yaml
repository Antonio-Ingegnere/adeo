# Edit agents here; timeout is seconds. Write stages reserve one explicit resume invocation.
# Verification is baseline-aware: the same verifier records the pre-delivery state before the
# first write stage; later runs block only on new or changed failures (scripts/verify-delivery.py).
agents:
  spec:
    provider: codex
    model: gpt-6-astra
    effort: high
    workspace: read
    shell: true
    timeout: 600
  investigate:
    provider: claude
    model: haiku
    effort: medium
    workspace: read
    shell: true
    timeout: 600
  diagnose-deep:
    provider: claude
    model: sonnet
    effort: high
    workspace: read
    shell: true
    timeout: 600
  independent:
    provider: codex
    model: gpt-6-astra
    effort: high
    workspace: read
    shell: true
    timeout: 600
  code:
    provider: claude
    model: sonnet
    effort: medium
    workspace: write
    shell: true
    timeout: 1800
  baseline:
    provider: command
    command: [python3, scripts/verify-delivery.py, --baseline]
    capture: verification_baseline
    success: recorded
    failure: error
    timeout: 1800
  tests:
    provider: command
    command: [python3, scripts/verify-delivery.py]
    capture: verifier_evidence
    timeout: 1800
flows:
  feature:
    start: SPECIFY
    limits: {run_invocations: 12, on_exceeded: NEEDS_HUMAN}
    states:
      SPECIFY:
        agent: spec
        consumes: [request]
        produces:
          microspec: {format: yaml, schema: microspec}
        on: {ready: BASELINE_VERIFY, needs_clarification: NEEDS_HUMAN}
      BASELINE_VERIFY:
        agent: baseline
        produces:
          verification_baseline: {format: markdown}
        on: {recorded: IMPLEMENT, error: NEEDS_HUMAN}
      IMPLEMENT:
        run:
          - agent: code
            budget: {invocations: 2}
        consumes: [request, microspec]
        produces:
          implementation_handoff: {format: markdown}
        on: {ready: VERIFY, blocked: NEEDS_HUMAN}
      VERIFY:
        run:
          - agent: tests
            budget: {invocations: 2}
        budget: {visits: 2}
        consumes: [microspec, implementation_handoff, verification_baseline]
        produces:
          verifier_evidence: {format: markdown}
        on: {pass: READY_FOR_MANUAL_QA, fail: DIAGNOSE_FAILURE}
      DIAGNOSE_FAILURE:
        run:
        - agent: investigate
        - agent: diagnose-deep
          when: [inconclusive, budget_exceeded, diagnosis_disproved, verification_same_failure]
          context: continue
        - agent: independent
          when: [inconclusive, diagnosis_disproved, verification_same_failure]
          context: fresh
        on_exhausted: NEEDS_REDIAGNOSIS
        consumes: [microspec, implementation_handoff, verifier_evidence]
        produces:
          failure_diagnosis: {format: markdown}
        on: {ready: REPAIR_ONCE, inconclusive: NEEDS_REDIAGNOSIS, needs_clarification: NEEDS_HUMAN}
      REPAIR_ONCE:
        run:
          - agent: code
            budget: {invocations: 2}
        consumes: [microspec, verifier_evidence, failure_diagnosis]
        produces:
          implementation_handoff: {format: markdown}
        on: {ready: VERIFY_AGAIN, blocked: NEEDS_REDIAGNOSIS}
      VERIFY_AGAIN:
        agent: tests
        consumes: [microspec, implementation_handoff, verification_baseline]
        produces:
          verifier_evidence: {format: markdown}
        on: {pass: READY_FOR_MANUAL_QA, fail: NEEDS_REDIAGNOSIS}
      # Explicit /deliver resume only: re-verify the retained work; budgets are not reset.
      NEEDS_REDIAGNOSIS: {terminal: true, resume_to: VERIFY}
  bugfix:
    start: TRIAGE
    limits: {run_invocations: 15, on_exceeded: NEEDS_HUMAN}
    states:
      TRIAGE:
        agent: spec
        consumes: [request]
        produces:
          bug_spec: {format: yaml, schema: microspec}
        on: {ready: REPRODUCE, needs_clarification: NEEDS_HUMAN}
      REPRODUCE:
        agent: investigate
        consumes: [request, bug_spec]
        produces:
          reproduction_evidence: {format: markdown}
        on: {ready: DIAGNOSE, inconclusive: NEEDS_HUMAN}
      DIAGNOSE:
        run:
        - agent: investigate
        - agent: diagnose-deep
          when: [inconclusive, budget_exceeded, diagnosis_disproved, verification_same_failure]
          context: continue
        - agent: independent
          when: [inconclusive, diagnosis_disproved, verification_same_failure]
          context: fresh
        on_exhausted: NEEDS_HUMAN
        consumes: [request, bug_spec, reproduction_evidence]
        produces:
          diagnosis: {format: markdown}
        on: {ready: SPECIFY_FIX, inconclusive: NEEDS_HUMAN}
      SPECIFY_FIX:
        agent: spec
        consumes: [request, reproduction_evidence, diagnosis]
        produces:
          fix_microspec: {format: yaml, schema: microspec}
        on: {ready: BASELINE_VERIFY, needs_clarification: NEEDS_HUMAN}
      BASELINE_VERIFY:
        agent: baseline
        produces:
          verification_baseline: {format: markdown}
        on: {recorded: FIX, error: NEEDS_HUMAN}
      FIX:
        run:
          - agent: code
            budget: {invocations: 2}
        consumes: [fix_microspec, diagnosis]
        produces:
          implementation_handoff: {format: markdown}
        on: {ready: VERIFY, blocked: NEEDS_HUMAN}
      VERIFY:
        agent: tests
        consumes: [fix_microspec, reproduction_evidence, implementation_handoff, verification_baseline]
        produces:
          verifier_evidence: {format: markdown}
        on: {pass: READY_FOR_MANUAL_QA, fail: REDIAGNOSE}
      REDIAGNOSE:
        agent: independent
        consumes: [request, reproduction_evidence, verifier_evidence, diagnosis]
        produces:
          revised_diagnosis: {format: markdown}
        on: {ready: REFIX, inconclusive: NEEDS_HUMAN}
      REFIX:
        run:
          - agent: code
            budget: {invocations: 2}
        consumes: [fix_microspec, revised_diagnosis, verifier_evidence]
        produces:
          implementation_handoff: {format: markdown}
        on: {ready: VERIFY_AGAIN, blocked: NEEDS_HUMAN}
      VERIFY_AGAIN:
        agent: tests
        consumes: [fix_microspec, reproduction_evidence, implementation_handoff, verification_baseline]
        produces:
          verifier_evidence: {format: markdown}
        on: {pass: READY_FOR_MANUAL_QA, fail: NEEDS_HUMAN}
lifecycle:
  manual_qa: true
  accept: {commit: true}
  reopen: true
