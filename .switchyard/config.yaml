# Edit agents here; all specification states reuse spec.
agents:
  spec:
    provider: codex
    model: gpt-6-astra
    effort: high
    workspace: read
    shell: true
  investigate:
    provider: claude
    model: haiku
    effort: medium
    workspace: read
    shell: true
  diagnose-deep:
    provider: claude
    model: sonnet
    effort: high
    workspace: read
    shell: true
  independent:
    provider: codex
    model: gpt-6-astra
    effort: high
    workspace: read
    shell: true
  code:
    provider: claude
    model: sonnet
    effort: medium
    workspace: write
    shell: true
  tests:
    provider: command
    command: [python3, scripts/verify-delivery.py]
    capture: verifier_evidence
flows:
  feature:
    start: SPECIFY
    limits: {run_invocations: 10, on_exceeded: NEEDS_HUMAN}
    states:
      SPECIFY:
        agent: spec
        consumes: [request]
        produces:
          microspec: {format: yaml, schema: microspec}
        on: {ready: IMPLEMENT, needs_clarification: NEEDS_HUMAN}
      IMPLEMENT:
        agent: code
        consumes: [request, microspec]
        produces:
          implementation_handoff: {format: markdown}
        on: {ready: VERIFY, blocked: NEEDS_HUMAN}
      VERIFY:
        agent: tests
        consumes: [microspec, implementation_handoff]
        produces:
          verifier_evidence: {format: markdown}
        on: {pass: READY_FOR_MANUAL_QA, fail: DIAGNOSE_FAILURE}
      DIAGNOSE_FAILURE:
        run:
        - agent: investigate
        - agent: diagnose-deep
          when: [inconclusive, budget_exceeded]
          context: continue
        - agent: independent
          when: [inconclusive, diagnosis_disproved, verification_same_failure]
          context: fresh
        on_exhausted: NEEDS_REDIAGNOSIS
        consumes: [microspec, implementation_handoff, verifier_evidence]
        produces:
          failure_diagnosis: {format: markdown}
        on: {ready: REPAIR_ONCE, inconclusive: NEEDS_REDIAGNOSIS, needs_clarification: NEEDS_HUMAN}
      REPAIR_ONCE:
        agent: code
        consumes: [microspec, verifier_evidence, failure_diagnosis]
        produces:
          implementation_handoff: {format: markdown}
        on: {ready: VERIFY_AGAIN, blocked: NEEDS_REDIAGNOSIS}
      VERIFY_AGAIN:
        agent: tests
        consumes: [microspec, implementation_handoff]
        produces:
          verifier_evidence: {format: markdown}
        on: {pass: READY_FOR_MANUAL_QA, fail: NEEDS_REDIAGNOSIS}
  bugfix:
    start: TRIAGE
    limits: {run_invocations: 14, on_exceeded: NEEDS_HUMAN}
    states:
      TRIAGE:
        agent: spec
        consumes: [request]
        produces:
          bug_spec: {format: yaml, schema: microspec}
        on: {ready: REPRODUCE, needs_clarification: NEEDS_HUMAN}
      REPRODUCE:
        agent: investigate
        consumes: [request, bug_spec]
        produces:
          reproduction_evidence: {format: markdown}
        on: {ready: DIAGNOSE, inconclusive: NEEDS_HUMAN}
      DIAGNOSE:
        run:
        - agent: investigate
        - agent: diagnose-deep
          when: [inconclusive, budget_exceeded]
          context: continue
        - agent: independent
          when: [inconclusive, diagnosis_disproved, verification_same_failure]
          context: fresh
        on_exhausted: NEEDS_HUMAN
        consumes: [request, bug_spec, reproduction_evidence]
        produces:
          diagnosis: {format: markdown}
        on: {ready: SPECIFY_FIX, inconclusive: NEEDS_HUMAN}
      SPECIFY_FIX:
        agent: spec
        consumes: [request, reproduction_evidence, diagnosis]
        produces:
          fix_microspec: {format: yaml, schema: microspec}
        on: {ready: FIX, needs_clarification: NEEDS_HUMAN}
      FIX:
        agent: code
        consumes: [fix_microspec, diagnosis]
        produces:
          implementation_handoff: {format: markdown}
        on: {ready: VERIFY, blocked: NEEDS_HUMAN}
      VERIFY:
        agent: tests
        consumes: [fix_microspec, reproduction_evidence, implementation_handoff]
        produces:
          verifier_evidence: {format: markdown}
        on: {pass: READY_FOR_MANUAL_QA, fail: REDIAGNOSE}
      REDIAGNOSE:
        agent: independent
        consumes: [request, reproduction_evidence, verifier_evidence, diagnosis]
        produces:
          revised_diagnosis: {format: markdown}
        on: {ready: REFIX, inconclusive: NEEDS_HUMAN}
      REFIX:
        agent: code
        consumes: [fix_microspec, revised_diagnosis, verifier_evidence]
        produces:
          implementation_handoff: {format: markdown}
        on: {ready: VERIFY_AGAIN, blocked: NEEDS_HUMAN}
      VERIFY_AGAIN:
        agent: tests
        consumes: [fix_microspec, reproduction_evidence, implementation_handoff]
        produces:
          verifier_evidence: {format: markdown}
        on: {pass: READY_FOR_MANUAL_QA, fail: NEEDS_HUMAN}
lifecycle:
  manual_qa: true
  accept: {commit: true}
  reopen: true
