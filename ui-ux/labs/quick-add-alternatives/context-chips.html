<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adeo Quick Add — Context chips</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg:#f5f5f5;--surface:#fff;--surface-sunken:#f7f7f7;--surface-hover:#f4f4f4;
      --surface-active:#e6e6e6;--surface-selected:#e0e0e0;--border:#d6d6d6;
      --border-subtle:#e0e0e0;--border-strong:#a6a6a6;--border-control:#b0b0b0;
      --text:#222;--text-body:#444;--text-muted:#666;--text-hint:#6d6d6d;--text-ghost:#8a8a8a;
      --text-chip:#3a3a3a;--text-on-accent:#000;--accent:#1d72f3;--accent-focus:#4c9ffe;
      --danger:#b00020;--success:#388338;--priority-low:#a4f07f;--priority-medium:#ffd08f;
      --priority-high:#ff8a8a;--tag-design:#c8e6c9;--tag-planning:#bbdefb;--tag-follow:#ffe0b2;
      --shadow-popover:0 6px 20px rgba(0,0,0,.12);--radius-s:6px;--radius-m:8px;
      --radius-l:10px;--font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }
    @media(prefers-color-scheme:dark){:root{--bg:#171717;--surface:#202020;--surface-sunken:#191919;
      --surface-hover:#2a2a2a;--surface-active:#333;--surface-selected:#383838;--border:#3a3a3a;
      --border-subtle:#2e2e2e;--border-strong:#5e5e5e;--border-control:#5a5a5a;--text:#e9e9e9;
      --text-body:#d2d2d2;--text-muted:#ababab;--text-hint:#9c9c9c;--text-ghost:#7d7d7d;
      --text-on-accent:#111;--accent:#3d8bfd;--accent-focus:#6ab4ff;--danger:#ff7b8a;
      --success:#6cc46c;--priority-low:#2f4526;--priority-medium:#4a3821;--priority-high:#4a2727;
      --shadow-popover:0 6px 20px rgba(0,0,0,.55)}}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;overflow:hidden;background:var(--bg);
      color:var(--text);font:13px var(--font-sans)} button,input{font:inherit;color:inherit}
    :focus-visible{outline:2px solid var(--accent-focus);outline-offset:2px}
    .app{min-height:100vh;background:var(--surface);display:grid;grid-template-columns:288px minmax(0,1fr)}
    .sidebar{background:var(--surface-sunken);padding:18px 12px;display:flex;flex-direction:column;gap:22px}
    .brand{font-size:18px;font-weight:600;padding:0 10px 8px}.side-title{margin:0 10px 7px;
      color:var(--text-hint);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
    .side-list{display:flex;flex-direction:column;gap:3px}.side-item{border:0;background:transparent;
      border-radius:8px;padding:8px 10px;text-align:left;display:flex;gap:9px;align-items:center;cursor:pointer}
    .side-item.active{background:var(--surface-selected);font-weight:600}.side-count{margin-left:auto;color:var(--text-muted)}
    .side-dot{width:9px;height:9px;border-radius:50%;background:var(--tag-design)}
    main{padding:42px 40px;overflow:auto}.main-inner{max-width:920px;margin:0 auto}.view-bar{display:flex;
      align-items:center;min-height:24px}.view-title{border:0;background:transparent;padding:2px 0;font-weight:600;
      cursor:pointer}.view-count{color:var(--text-muted);margin-left:8px}.key-hint{margin-left:auto;color:var(--text-hint);
      font-size:11px}.key{font-family:ui-monospace,monospace;border:1px solid var(--border);border-radius:5px;
      padding:2px 5px;background:var(--surface-sunken)}.compose{margin-top:8px;position:relative}
    .input-row{display:flex;gap:8px}.input-wrap{flex:1;position:relative}.task-input{width:100%;height:34px;
      border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:0 12px;color:var(--text)}
    .task-input::placeholder{color:var(--text-ghost)}.task-input:focus{border-color:var(--border-strong)}
    .add-button{width:34px;height:34px;flex:0 0 34px;border:0;border-radius:50%;background:var(--accent);
      color:var(--text-on-accent);display:grid;place-items:center;cursor:pointer}.add-button svg{width:20px;height:20px}
    .context-strip{display:flex;align-items:center;gap:6px;min-height:38px;padding:6px 0;position:relative;
      flex-wrap:wrap}.context-strip[hidden]{display:none}.strip-label{color:var(--text-hint);font-size:11px;margin-right:2px}
    .chip{min-height:26px;border:1px solid var(--border);border-radius:10px;background:var(--surface);
      padding:3px 9px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}.chip:hover,.chip[aria-expanded=true]{background:var(--surface-hover)}
    .chip[data-active=true]{background:var(--surface-selected);border-color:var(--border-strong)}
    .chip-icon{color:var(--text-muted);font-size:11px}.priority-dot{width:9px;height:9px;border-radius:50%;background:var(--border-control)}
    .priority-dot.high{background:#ff6b6b}.tag-mini{width:8px;height:8px;border-radius:50%;background:var(--tag-design)}
    .strip-done{border:0;background:transparent;color:var(--text-muted);padding:4px 6px;cursor:pointer;margin-left:auto}
    .menu{position:absolute;top:39px;z-index:20;min-width:190px;padding:6px;background:var(--surface);
      border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-popover);display:flex;
      flex-direction:column;gap:3px}.menu[hidden]{display:none}.menu button{border:0;background:transparent;
      border-radius:7px;padding:8px 9px;text-align:left;display:flex;align-items:center;gap:8px;cursor:pointer}
    .menu button:hover,.menu button.selected{background:var(--surface-hover)}.menu .check{margin-left:auto;color:var(--accent)}
    .feedback{min-height:18px;font-size:11px;color:var(--success);margin:2px 0 0}.feedback.error{color:var(--danger)}
    .tasks{margin-top:18px}.task-row{display:flex;gap:8px;align-items:flex-start;padding:11px 0;position:relative}
    .task-row:after{content:"";position:absolute;left:22px;right:6px;bottom:0;height:1px;background:var(--border-subtle)}
    .task-check{appearance:none;width:18px;height:18px;border:1px solid var(--border-control);border-radius:50%;
      margin:2px 0 0;background:transparent}.task-check.high{border-color:#ff5f5f;background:var(--priority-high)}
    .drag{width:14px;color:var(--text-ghost);padding-top:3px}.task-main{display:flex;flex-direction:column;gap:6px;min-width:0}
    .task-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--text-muted);font-size:11px}
    .task-tag{border:1px solid rgba(0,0,0,.08);border-radius:9px;padding:1px 7px;color:var(--text-chip)}
    .design{background:var(--tag-design)}.planning{background:var(--tag-planning)}.follow{background:var(--tag-follow)}
    .concept-note{margin-top:18px;color:var(--text-hint);font-size:11px;display:flex;gap:6px;align-items:center}
    @media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{display:none}main{padding:28px 18px}.key-hint{display:none}}
    @media(max-width:480px){.context-strip{align-items:stretch}.chip{min-height:44px}.strip-label{width:100%}
      .strip-done{min-height:44px;margin-left:0}.add-button{width:44px;height:44px;flex-basis:44px}.task-input{height:44px}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Adeo navigation">
      <div class="brand">Adeo</div>
      <section><p class="side-title">Lists</p><div class="side-list">
        <button class="side-item"><span>All lists</span><span class="side-count">8</span></button>
        <button class="side-item active"><span>Work</span><span class="side-count">4</span></button>
        <button class="side-item"><span>Personal</span><span class="side-count">3</span></button>
      </div></section>
      <section><p class="side-title">Smart lists</p><div class="side-list"><button class="side-item"><span>Today</span><span class="side-count">3</span></button></div></section>
      <section><p class="side-title">Tags</p><div class="side-list"><button class="side-item"><span class="side-dot"></span><span>Design</span><span class="side-count">2</span></button></div></section>
    </aside>
    <main><div class="main-inner">
      <div class="view-bar"><button class="view-title">Work ▾</button><span class="view-count">4 tasks</span>
        <span class="key-hint"><span class="key">⌘N</span> Quick Add</span></div>
      <section class="compose" aria-label="Quick Add task">
        <div class="input-row"><div class="input-wrap"><input id="task-input" class="task-input" value="Prepare sprint notes" aria-label="Task name"></div>
          <button id="add" class="add-button" aria-label="Add task"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg></button></div>
        <div id="context-strip" class="context-strip">
          <span class="strip-label">Next task</span>
          <button class="chip" data-menu="list" aria-expanded="false"><span class="chip-icon">▤</span><span id="list-value">Work</span><span>▾</span></button>
          <button class="chip" data-menu="priority" aria-expanded="false"><span id="priority-dot" class="priority-dot"></span><span id="priority-value">No priority</span><span>▾</span></button>
          <button class="chip" data-menu="reminder" aria-expanded="false"><span class="chip-icon">◷</span><span id="reminder-value">No reminder</span><span>▾</span></button>
          <button class="chip" data-menu="tags" aria-expanded="false"><span class="tag-mini"></span><span id="tags-value">Tags</span><span>▾</span></button>
          <button id="strip-done" class="strip-done">Done</button>
          <div id="menu" class="menu" hidden></div>
        </div>
        <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
      </section>
      <section id="tasks" class="tasks" aria-label="Tasks">
        <div class="task-row"><span class="drag">⠿</span><input class="task-check" type="checkbox" aria-label="Complete Review launch checklist"><div class="task-main"><span>Review launch checklist</span><div class="task-meta"><span>Today, 4:00 PM</span><span class="task-tag design">Design</span></div></div></div>
        <div class="task-row"><span class="drag">⠿</span><input class="task-check high" type="checkbox" aria-label="Complete Send weekly update"><div class="task-main"><span>Send weekly update</span><div class="task-meta"><span>High priority</span><span class="task-tag planning">Planning</span></div></div></div>
      </section>
      <p class="concept-note"><span class="key">Esc</span> closes a menu, then collapses the context strip. The draft is kept.</p>
    </div></main>
  </div>
  <script>
    const input = document.getElementById('task-input');
    const strip = document.getElementById('context-strip');
    const menu = document.getElementById('menu');
    const feedback = document.getElementById('feedback');
    const state = { list:'Work', priority:'No priority', reminder:'No reminder', tags:[] };
    const choices = {
      list:['Current list','Work','Personal','No list'],
      priority:['No priority','Low priority','Medium priority','High priority'],
      reminder:['No reminder','Today','Tomorrow','Pick a date…'],
      tags:['Design','Planning','Follow-up']
    };
    let activeMenu = null;
    function openQuickAdd(){ strip.hidden=false; input.focus(); feedback.textContent=''; }
    function closeMenu(){ activeMenu=null; menu.hidden=true; document.querySelectorAll('[data-menu]').forEach(b=>b.setAttribute('aria-expanded','false')); }
    function paint(){
      document.getElementById('list-value').textContent=state.list;
      document.getElementById('priority-value').textContent=state.priority;
      document.getElementById('priority-dot').className='priority-dot'+(state.priority==='High priority'?' high':'');
      document.getElementById('reminder-value').textContent=state.reminder;
      document.getElementById('tags-value').textContent=state.tags.length?state.tags.join(', '):'Tags';
      document.querySelectorAll('[data-menu]').forEach(b=>b.dataset.active=String((b.dataset.menu==='list'&&state.list!=='Current list')||(b.dataset.menu==='priority'&&state.priority!=='No priority')||(b.dataset.menu==='reminder'&&state.reminder!=='No reminder')||(b.dataset.menu==='tags'&&state.tags.length>0)));
    }
    function showMenu(kind, trigger){
      if(activeMenu===kind){closeMenu();return} activeMenu=kind; menu.replaceChildren();
      menu.style.left=Math.min(trigger.offsetLeft,Math.max(0,strip.clientWidth-190))+'px';
      menu.style.top=(trigger.offsetTop+trigger.offsetHeight+4)+'px';
      choices[kind].forEach(value=>{const button=document.createElement('button');button.type='button';
        const selected=kind==='tags'?state.tags.includes(value):state[kind]===value;
        button.className=selected?'selected':'';button.innerHTML='<span>'+value+'</span>'+(selected?'<span class="check">✓</span>':'');
        button.addEventListener('click',()=>{if(kind==='tags'){state.tags=state.tags.includes(value)?state.tags.filter(t=>t!==value):[...state.tags,value];paint();activeMenu=null;showMenu(kind,trigger)}else{state[kind]=value;paint();closeMenu()}input.focus()});menu.append(button)});
      menu.hidden=false;document.querySelectorAll('[data-menu]').forEach(b=>b.setAttribute('aria-expanded',String(b===trigger)));
    }
    function addTask(){const text=input.value.trim();if(!text){feedback.textContent='Enter a task before adding.';feedback.className='feedback error';input.focus();return}
      const row=document.createElement('div');row.className='task-row';const tags=state.tags.map(t=>'<span class="task-tag '+(t==='Design'?'design':t==='Planning'?'planning':'follow')+'">'+t+'</span>').join('');
      const meta=[state.list,state.priority!=='No priority'?state.priority:'',state.reminder!=='No reminder'?state.reminder:''].filter(Boolean).join(' · ');
      row.innerHTML='<span class="drag">⠿</span><input class="task-check'+(state.priority==='High priority'?' high':'')+'" type="checkbox"><div class="task-main"><span></span><div class="task-meta"><span>'+meta+'</span>'+tags+'</div></div>';
      row.querySelector('.task-main > span').textContent=text;row.querySelector('input').setAttribute('aria-label','Complete '+text);document.getElementById('tasks').prepend(row);input.value='';feedback.textContent='Task added to '+state.list+'.';feedback.className='feedback';closeMenu();strip.hidden=true;input.focus();}
    document.querySelectorAll('[data-menu]').forEach(button=>button.addEventListener('click',()=>showMenu(button.dataset.menu,button)));
    document.getElementById('strip-done').addEventListener('click',()=>{closeMenu();strip.hidden=true;input.focus()});
    document.getElementById('add').addEventListener('click',addTask);input.addEventListener('keydown',e=>{if(e.key==='Enter')addTask()});
    document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'){e.preventDefault();openQuickAdd()}else if(e.key==='Escape'){if(activeMenu)closeMenu();else if(!strip.hidden){strip.hidden=true;input.focus()}}});
    paint();openQuickAdd();
  </script>
</body>
</html>
