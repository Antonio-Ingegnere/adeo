<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adeo Quick Add — Quick card</title>
  <style>
    :root{color-scheme:light dark;--bg:#f5f5f5;--surface:#fff;--surface-sunken:#f7f7f7;
      --surface-hover:#f4f4f4;--surface-active:#e6e6e6;--surface-selected:#e0e0e0;
      --border:#d6d6d6;--border-subtle:#e0e0e0;--border-strong:#a6a6a6;--border-control:#b0b0b0;
      --text:#222;--text-body:#444;--text-muted:#666;--text-hint:#6d6d6d;--text-ghost:#8a8a8a;
      --text-chip:#3a3a3a;--text-on-accent:#000;--accent:#1d72f3;--accent-focus:#4c9ffe;
      --danger:#b00020;--success:#388338;--priority-low:#a4f07f;--priority-medium:#ffd08f;
      --priority-high:#ff8a8a;--tag-design:#c8e6c9;--tag-planning:#bbdefb;--tag-follow:#ffe0b2;
      --radius-s:6px;--radius-m:8px;--radius-l:10px;--shadow-popover:0 6px 20px rgba(0,0,0,.12);
      --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    @media(prefers-color-scheme:dark){:root{--bg:#171717;--surface:#202020;--surface-sunken:#191919;
      --surface-hover:#2a2a2a;--surface-active:#333;--surface-selected:#383838;--border:#3a3a3a;
      --border-subtle:#2e2e2e;--border-strong:#5e5e5e;--border-control:#5a5a5a;--text:#e9e9e9;
      --text-body:#d2d2d2;--text-muted:#ababab;--text-hint:#9c9c9c;--text-ghost:#7d7d7d;
      --text-on-accent:#111;--accent:#3d8bfd;--accent-focus:#6ab4ff;--danger:#ff7b8a;
      --success:#6cc46c;--priority-low:#2f4526;--priority-medium:#4a3821;--priority-high:#4a2727;
      --shadow-popover:0 6px 20px rgba(0,0,0,.55)}}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:var(--bg);color:var(--text);
      font:13px var(--font-sans)}button,input{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--accent-focus);outline-offset:2px}
    .app{min-height:100vh;background:var(--surface);display:grid;grid-template-columns:288px minmax(0,1fr)}
    .sidebar{background:var(--surface-sunken);padding:18px 12px;display:flex;flex-direction:column;gap:22px}
    .brand{font-size:18px;font-weight:600;padding:0 10px 8px}.side-title{margin:0 10px 7px;color:var(--text-hint);
      font-size:11px;text-transform:uppercase;letter-spacing:.05em}.side-list{display:flex;flex-direction:column;gap:3px}
    .side-item{border:0;background:transparent;border-radius:8px;padding:8px 10px;text-align:left;display:flex;
      align-items:center;gap:9px;cursor:pointer}.side-item.active{background:var(--surface-selected);font-weight:600}
    .side-count{margin-left:auto;color:var(--text-muted)}.side-dot{width:9px;height:9px;border-radius:50%;background:var(--tag-design)}
    main{padding:42px 40px;overflow:auto}.main-inner{max-width:920px;margin:0 auto}.view-bar{display:flex;align-items:center;min-height:24px}
    .view-title{border:0;background:transparent;padding:2px 0;font-weight:600;cursor:pointer}.view-count{color:var(--text-muted);margin-left:8px}
    .key-hint{margin-left:auto;color:var(--text-hint);font-size:11px}.key{font-family:ui-monospace,monospace;
      border:1px solid var(--border);border-radius:5px;padding:2px 5px;background:var(--surface-sunken)}
    .compose{margin-top:8px;position:relative;z-index:5}.input-row{display:flex;gap:8px}.input-wrap{flex:1}.task-input{width:100%;height:34px;
      border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:0 12px;color:var(--text)}
    .task-input:focus{border-color:var(--border-strong)}.add-button{width:34px;height:34px;flex:0 0 34px;border:0;
      border-radius:50%;background:var(--accent);color:var(--text-on-accent);display:grid;place-items:center;cursor:pointer}
    .add-button svg{width:20px;height:20px}.quick-card{position:absolute;top:40px;left:0;right:42px;z-index:30;
      border:1px solid var(--border);border-radius:10px;background:var(--surface);box-shadow:var(--shadow-popover);overflow:hidden}
    .quick-card[hidden]{display:none}.card-header{display:flex;align-items:center;padding:9px 12px;border-bottom:1px solid var(--border-subtle)}
    .card-title{font-weight:600}.card-subtitle{margin-left:8px;color:var(--text-hint);font-size:11px}.card-close{margin-left:auto;
      border:0;background:transparent;color:var(--text-muted);padding:3px 5px;cursor:pointer}.palette-body{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:190px}
    .field-list{padding:6px;border-right:1px solid var(--border-subtle);background:var(--surface-sunken);display:flex;flex-direction:column;gap:2px}
    .field-button{border:0;border-radius:7px;background:transparent;padding:9px 10px;text-align:left;display:grid;
      grid-template-columns:20px minmax(0,1fr) auto;align-items:center;gap:6px;cursor:pointer}.field-button:hover,.field-button.active{background:var(--surface-selected)}
    .field-icon{color:var(--text-muted);text-align:center}.field-copy{min-width:0}.field-name{display:block;font-size:11px;color:var(--text-hint);margin-bottom:2px}
    .field-value{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.field-arrow{color:var(--text-hint)}
    .choice-panel{padding:13px}.choice-heading{font-size:11px;color:var(--text-hint);margin:0 0 8px}.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
    .choice{border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:9px 10px;text-align:left;display:flex;
      align-items:center;gap:7px;cursor:pointer}.choice:hover{background:var(--surface-hover)}.choice.selected{background:var(--surface-selected);border-color:var(--border-strong)}
    .choice-check{margin-left:auto;color:var(--accent)}.swatch{width:9px;height:9px;border-radius:50%;background:var(--border-control)}
    .swatch.low{background:#7ed957}.swatch.medium{background:#ffb866}.swatch.high{background:#ff6b6b}.swatch.design{background:var(--tag-design)}
    .swatch.planning{background:var(--tag-planning)}.swatch.follow{background:var(--tag-follow)}
    .choice-empty{color:var(--text-muted);padding:14px 4px}.card-footer{border-top:1px solid var(--border-subtle);padding:8px 10px;display:flex;align-items:center;gap:8px}
    .effective{font-size:11px;color:var(--text-hint);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .card-add{margin-left:auto;border:0;border-radius:8px;background:var(--accent);color:var(--text-on-accent);padding:7px 12px;font-weight:600;cursor:pointer}
    .feedback{min-height:18px;font-size:11px;color:var(--success);margin:3px 0 0}.feedback.error{color:var(--danger)}
    .tasks{margin-top:18px}.task-row{display:flex;gap:8px;align-items:flex-start;padding:11px 0;position:relative}
    .task-row:after{content:"";position:absolute;left:22px;right:6px;bottom:0;height:1px;background:var(--border-subtle)}
    .task-check{appearance:none;width:18px;height:18px;border:1px solid var(--border-control);border-radius:50%;margin:2px 0 0}
    .task-check.high{border-color:#ff5f5f;background:var(--priority-high)}.drag{width:14px;color:var(--text-ghost);padding-top:3px}
    .task-main{display:flex;flex-direction:column;gap:6px;min-width:0}.task-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--text-muted);font-size:11px}
    .task-tag{border:1px solid rgba(0,0,0,.08);border-radius:9px;padding:1px 7px;color:var(--text-chip)}.design{background:var(--tag-design)}
    .planning{background:var(--tag-planning)}.follow{background:var(--tag-follow)}.concept-note{margin-top:18px;color:var(--text-hint);font-size:11px;display:flex;gap:6px;align-items:center}
    @media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{display:none}main{padding:28px 18px}.key-hint{display:none}.quick-card{right:52px}.palette-body{grid-template-columns:190px minmax(0,1fr)}}
    @media(max-width:560px){.task-input{height:44px}.add-button{width:44px;height:44px;flex-basis:44px}.quick-card{top:50px;right:52px}.palette-body{grid-template-columns:1fr}.field-list{border-right:0;border-bottom:1px solid var(--border-subtle);display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.field-button{min-height:44px}.choice{min-height:44px}.choice-panel{padding:10px}.card-subtitle{display:none}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Adeo navigation">
      <div class="brand">Adeo</div>
      <section><p class="side-title">Lists</p><div class="side-list">
        <button class="side-item"><span>All lists</span><span class="side-count">8</span></button>
        <button class="side-item active"><span>Work</span><span class="side-count">4</span></button>
        <button class="side-item"><span>Personal</span><span class="side-count">3</span></button></div></section>
      <section><p class="side-title">Smart lists</p><div class="side-list"><button class="side-item"><span>Today</span><span class="side-count">3</span></button></div></section>
      <section><p class="side-title">Tags</p><div class="side-list"><button class="side-item"><span class="side-dot"></span><span>Design</span><span class="side-count">2</span></button></div></section>
    </aside>
    <main><div class="main-inner">
      <div class="view-bar"><button class="view-title">Work ▾</button><span class="view-count">4 tasks</span><span class="key-hint"><span class="key">⌘N</span> Quick Add</span></div>
      <section class="compose" aria-label="Quick Add task">
        <div class="input-row"><div class="input-wrap"><input id="task-input" class="task-input" value="Prepare sprint notes" aria-label="Task name" aria-expanded="true" aria-controls="quick-card"></div>
          <button id="add" class="add-button" aria-label="Add task"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg></button></div>
        <div id="quick-card" class="quick-card" role="dialog" aria-modal="false" aria-labelledby="card-title">
          <div class="card-header"><span id="card-title" class="card-title">Task context</span><span class="card-subtitle">Choose fields — no command syntax</span><button id="close-card" class="card-close" aria-label="Close task context">Esc</button></div>
          <div class="palette-body">
            <div id="field-list" class="field-list" role="listbox" aria-label="Task fields">
              <button class="field-button active" data-field="list" role="option" aria-selected="true"><span class="field-icon">▤</span><span class="field-copy"><span class="field-name">List</span><span id="list-value" class="field-value">Work</span></span><span class="field-arrow">›</span></button>
              <button class="field-button" data-field="priority" role="option" aria-selected="false"><span class="field-icon">●</span><span class="field-copy"><span class="field-name">Priority</span><span id="priority-value" class="field-value">None</span></span><span class="field-arrow">›</span></button>
              <button class="field-button" data-field="reminder" role="option" aria-selected="false"><span class="field-icon">◷</span><span class="field-copy"><span class="field-name">Reminder</span><span id="reminder-value" class="field-value">None</span></span><span class="field-arrow">›</span></button>
              <button class="field-button" data-field="tags" role="option" aria-selected="false"><span class="field-icon">#</span><span class="field-copy"><span class="field-name">Tags</span><span id="tags-value" class="field-value">None</span></span><span class="field-arrow">›</span></button>
            </div>
            <div id="choice-panel" class="choice-panel"><p id="choice-heading" class="choice-heading">Choose list</p><div id="choice-grid" class="choice-grid"></div></div>
          </div>
          <div class="card-footer"><span id="effective" class="effective">Work · no priority · no reminder</span><button id="card-add" class="card-add">Add task</button></div>
        </div>
        <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
      </section>
      <section id="tasks" class="tasks" aria-label="Tasks">
        <div class="task-row"><span class="drag">⠿</span><input class="task-check" type="checkbox" aria-label="Complete Review launch checklist"><div class="task-main"><span>Review launch checklist</span><div class="task-meta"><span>Today, 4:00 PM</span><span class="task-tag design">Design</span></div></div></div>
        <div class="task-row"><span class="drag">⠿</span><input class="task-check high" type="checkbox" aria-label="Complete Send weekly update"><div class="task-main"><span>Send weekly update</span><div class="task-meta"><span>High priority</span><span class="task-tag planning">Planning</span></div></div></div>
      </section>
      <p class="concept-note"><span class="key">↑↓</span> moves between fields. <span class="key">Esc</span> closes choices, then the card.</p>
    </div></main>
  </div>
  <script>
    const input=document.getElementById('task-input');const card=document.getElementById('quick-card');
    const panel=document.getElementById('choice-panel');const grid=document.getElementById('choice-grid');const feedback=document.getElementById('feedback');
    const fieldButtons=[...document.querySelectorAll('.field-button')];let activeField='list';
    const state={list:'Work',priority:'None',reminder:'None',tags:[]};
    const choices={list:['Current list','Work','Personal','No list'],priority:['None','Low','Medium','High'],reminder:['None','Today','Tomorrow','Pick a date…'],tags:['Design','Planning','Follow-up']};
    function openCard(){card.hidden=false;input.setAttribute('aria-expanded','true');showField(activeField);input.focus();feedback.textContent=''}
    function closeCard(){card.hidden=true;input.setAttribute('aria-expanded','false');input.focus()}
    function paint(){document.getElementById('list-value').textContent=state.list;document.getElementById('priority-value').textContent=state.priority;
      document.getElementById('reminder-value').textContent=state.reminder;document.getElementById('tags-value').textContent=state.tags.length?state.tags.join(', '):'None';
      document.getElementById('effective').textContent=[state.list,state.priority!=='None'?state.priority+' priority':'no priority',state.reminder!=='None'?state.reminder:'no reminder',...state.tags].join(' · ')}
    function showField(field){activeField=field;panel.hidden=false;document.getElementById('choice-heading').textContent='Choose '+field;
      fieldButtons.forEach(b=>{const active=b.dataset.field===field;b.classList.toggle('active',active);b.setAttribute('aria-selected',String(active))});grid.replaceChildren();
      choices[field].forEach(value=>{const button=document.createElement('button');button.type='button';button.className='choice';
        const selected=field==='tags'?state.tags.includes(value):state[field]===value;if(selected)button.classList.add('selected');
        const swatch=field==='priority'?'<span class="swatch '+value.toLowerCase()+'"></span>':field==='tags'?'<span class="swatch '+(value==='Follow-up'?'follow':value.toLowerCase())+'"></span>':'';
        button.innerHTML=swatch+'<span>'+value+'</span>'+(selected?'<span class="choice-check">✓</span>':'');button.addEventListener('click',()=>{if(field==='tags')state.tags=state.tags.includes(value)?state.tags.filter(t=>t!==value):[...state.tags,value];else state[field]=value;paint();showField(field)});grid.append(button)})}
    function addTask(){const text=input.value.trim();if(!text){feedback.textContent='Enter a task before adding.';feedback.className='feedback error';input.focus();return}
      const row=document.createElement('div');row.className='task-row';const tags=state.tags.map(t=>'<span class="task-tag '+(t==='Design'?'design':t==='Planning'?'planning':'follow')+'">'+t+'</span>').join('');
      const meta=[state.list,state.priority!=='None'?state.priority+' priority':'',state.reminder!=='None'?state.reminder:''].filter(Boolean).join(' · ');
      row.innerHTML='<span class="drag">⠿</span><input class="task-check'+(state.priority==='High'?' high':'')+'" type="checkbox"><div class="task-main"><span></span><div class="task-meta"><span>'+meta+'</span>'+tags+'</div></div>';row.querySelector('.task-main > span').textContent=text;
      row.querySelector('input').setAttribute('aria-label','Complete '+text);document.getElementById('tasks').prepend(row);input.value='';feedback.textContent='Task added to '+state.list+'.';feedback.className='feedback';closeCard()}
    fieldButtons.forEach(button=>{button.addEventListener('click',()=>showField(button.dataset.field));button.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const i=fieldButtons.indexOf(button);const next=(i+(e.key==='ArrowDown'?1:-1)+fieldButtons.length)%fieldButtons.length;fieldButtons[next].focus();showField(fieldButtons[next].dataset.field)}else if(e.key==='Enter'){e.preventDefault();showField(button.dataset.field);grid.querySelector('button')?.focus()}})});
    input.addEventListener('keydown',e=>{if(e.key==='Enter')addTask();else if(e.key==='ArrowDown'&&!card.hidden){e.preventDefault();fieldButtons.find(b=>b.dataset.field===activeField)?.focus()}});
    document.getElementById('add').addEventListener('click',addTask);document.getElementById('card-add').addEventListener('click',addTask);document.getElementById('close-card').addEventListener('click',closeCard);
    document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'){e.preventDefault();openCard()}else if(e.key==='Escape'&&!card.hidden){e.preventDefault();if(!panel.hidden){panel.hidden=true;input.focus()}else closeCard()}});
    document.addEventListener('click',e=>{if(!card.hidden&&!card.contains(e.target)&&e.target!==input&&!document.getElementById('add').contains(e.target))closeCard()});
    paint();openCard();
  </script>
</body>
</html>
